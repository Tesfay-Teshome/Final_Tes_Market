<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- White Background Circle -->
  <circle cx="24" cy="24" r="22" fill="white" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Modern Shopping Cart/Market Icon -->
  <!-- Cart Base -->
  <path d="M8 8 L12 8 L16 28 C16 29.1 16.9 30 18 30 L36 30 C37.1 30 38 29.1 38 28 L40 16 L14 16" 
        stroke="url(#greenGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Cart Items (representing products) -->
  <circle cx="20" cy="24" r="2" fill="url(#greenGradient)"/>
  <circle cx="28" cy="24" r="2" fill="url(#greenGradient)"/>
  <circle cx="34" cy="24" r="2" fill="url(#greenGradient)"/>
  
  <!-- Cart Wheels -->
  <circle cx="20" cy="36" r="2" stroke="url(#greenGradient)" stroke-width="2" fill="white"/>
  <circle cx="32" cy="36" r="2" stroke="url(#greenGradient)" stroke-width="2" fill="white"/>
  
  <!-- Stylized "T" for Tes Market -->
  <path d="M22 10 L26 10 M24 10 L24 18" stroke="url(#greenGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Small decorative elements (market/commerce theme) -->
  <circle cx="12" cy="12" r="1" fill="url(#greenGradient)" opacity="0.6"/>
  <circle cx="36" cy="12" r="1" fill="url(#greenGradient)" opacity="0.6"/>
  <circle cx="40" cy="20" r="1" fill="url(#greenGradient)" opacity="0.6"/>
</svg>
